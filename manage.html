<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09294f" />
    <meta name="description" content="دليل الضمير التعليمي — المعلمون والمعلمات، الدورات، الدروس الخصوصية، والمدارس في مدينة الضمير." />
    <title>إدارة بطاقة المعلم — منصة الضمير التعليمية</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="supabase-config.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body data-page="manage">
    <div class="demo-banner" id="connection-status"><span class="demo-dot"></span> جارٍ الاتصال بقاعدة بيانات دليل الضمير…</div>
    <header class="site-header">
      <a class="brand" href="#home" data-view="home" aria-label="دليل الضمير التعليمي - الرئيسية">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M8 12.5c5.7-2.8 11.1-2.8 16 0v24c-4.9-2.8-10.3-2.8-16 0v-24Zm32 0c-5.7-2.8-11.1-2.8-16 0v24c4.9-2.8 10.3-2.8 16 0v-24Z"/><path d="M12 18c3.4-1.2 6.2-.9 9 .2M12 23c3.4-1.2 6.2-.9 9 .2m15-5.2c-3.4-1.2-6.2-.9-9 .2m9 4.8c-3.4-1.2-6.2-.9-9 .2"/></svg></span>
        <span class="brand-copy"><strong>دليل الضمير</strong><small>منصة التعليم المحلي</small></span>
      </a>
      <nav class="main-nav" aria-label="التنقل الرئيسي">
        <button class="nav-link active" data-view="home">الرئيسية</button>
        <button class="nav-link" data-view="teachers">المعلمون والمعلمات</button>
        <button class="nav-link" data-view="lessons">الدورات والدروس</button>
        <button class="nav-link" data-view="schools">المدارس</button>
        <button class="nav-link" data-view="memorials">تركوا أثرًا</button>
      </nav>
      <div class="header-actions">
        <button class="btn btn-quiet header-manage" data-view="manage">إدارة بطاقتي <span aria-hidden="true">↗</span></button>
        <button class="btn btn-primary header-apply" data-view="apply">انضم إلى الدليل <span aria-hidden="true">＋</span></button>
        <button class="mobile-menu" aria-label="فتح القائمة" aria-expanded="false">☰</button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="footer-main">
        <a class="brand brand-footer" href="#home" data-view="home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M8 12.5c5.7-2.8 11.1-2.8 16 0v24c-4.9-2.8-10.3-2.8-16 0v-24Zm32 0c-5.7-2.8-11.1-2.8-16 0v24c4.9-2.8 10.3-2.8 16 0v-24Z"/></svg></span><span class="brand-copy"><strong>دليل الضمير</strong><small>معًا نحو تعليم أقرب</small></span></a>
        <p>مساحة محلية تجمع المعلم والطالب والمدرسة، وتحتفي بمن ترك أثرًا طيبًا.</p>
        <button class="footer-admin" data-view="admin">لوحة الإدارة</button>
      </div>
      <div class="footer-bottom"><span>© <span id="year"></span> دليل الضمير التعليمي</span><span>صُنع لأهل الضمير بكل تقدير <b>✦</b></span></div>
    </footer>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
  </body>
</html>
